<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lịch sử phân loại hôm nay · DocSync</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffbfe;color:#201d26;font:15px/1.45 Roboto,Arial,sans-serif}
main{max-width:1240px;margin:auto;padding:28px 22px 48px}h1{margin:0;font-size:clamp(27px,5vw,40px);letter-spacing:-.035em}
.heading{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;margin-bottom:16px}
.heading p{color:#5f5966;margin:7px 0 0}.button{background:#eee5fb;color:#392460;text-decoration:none;font-weight:600;border-radius:20px;padding:9px 14px}
.table-wrap{overflow:auto;background:#fff;border:1px solid #e7dfea;border-radius:14px}
table{border-collapse:collapse;width:100%;text-align:left;min-width:640px}th,td{padding:11px 13px;border-bottom:1px solid #e7dfea;vertical-align:top}
th{font-size:13px;background:#f6effa}td{overflow-wrap:anywhere}tr:last-child td{border-bottom:0}
td:nth-child(2){max-width:390px}td:nth-child(4){max-width:360px}small{display:block;color:#655c72;margin-top:3px;font-size:12px}
.chip{display:inline-block;white-space:nowrap;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px}
.moved{color:#205e37;background:#e4f3e9}.review{color:#795112;background:#fff1d8}
@media(max-width:650px){main{padding:20px 13px 36px}}
</style></head><body>
<main>
<div class="heading"><div><h1>Lịch sử phân loại hôm nay</h1><p>__DAY__ · __SUMMARY__</p></div><a class="button" href="/history">Làm mới</a></div>
<div class="table-wrap" role="region" aria-label="Lịch sử phân loại theo file" tabindex="0">
<table><thead><tr><th scope="col">Giờ</th><th scope="col">File nguồn</th><th scope="col">Nhóm</th><th scope="col">Đích</th><th scope="col">Kết quả</th></tr></thead>
<tbody>__ROWS__</tbody></table>
</div>
</main>
</body></html>
