<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflows · DocSync</title>
<style>
:root{color-scheme:light;--ink:#201d26;--muted:#5f5966;--line:#e4dce9;--surface:#fffbfe;--card:#f7f2fa;--primary:#58428d;--tonal:#ece3fa;--good:#205e37;--warn:#805112}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font:15px/1.5 Roboto,Arial,sans-serif}
main{max-width:1120px;margin:auto;padding:28px 22px 54px}
a{color:var(--primary);font-weight:600}
header{margin:20px 0 24px}
h1{font-size:clamp(30px,5vw,44px);line-height:1.12;letter-spacing:-.03em;margin:0 0 10px}
h2{font-size:19px;margin:0 0 14px}
h3{font-size:16px;line-height:1.3;margin:0}
p{margin:0;color:var(--muted)}
.flow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding:0;list-style:none;font-size:13px}
.flow li{background:var(--tonal);padding:5px 11px;border-radius:20px;color:#362259}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.column,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.column h2{font-size:15px}
.cards{display:grid;gap:10px}
.item{border:1px solid var(--line);background:white;border-radius:14px;padding:14px;min-width:0}
.item p{font-size:13px;margin-top:6px;overflow-wrap:anywhere}
.item .source{font-weight:600;color:var(--primary)}
.item-footer{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}
.option{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;font-weight:600}
.option input{width:17px;height:17px;accent-color:var(--primary)}
.tag{font-size:12px;font-weight:600;color:var(--muted)}
.tag.good{color:var(--good)}
.tag.warn{color:var(--warn)}
button{border:0;border-radius:20px;padding:9px 13px;background:var(--primary);color:white;font:600 13px Roboto,Arial,sans-serif;cursor:pointer}
button.secondary{background:var(--tonal);color:#392460}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.lower{display:grid;grid-template-columns:minmax(270px,1fr) minmax(0,1.75fr);gap:16px;margin-top:20px}
form{display:grid;gap:8px;margin-top:10px}
label{font-weight:600;font-size:13px}
input{width:100%;border:1px solid #9a8ca5;border-radius:9px;background:white;color:var(--ink);padding:9px 10px;font:inherit}
form button{justify-self:start;margin-top:4px}
.feedback{min-height:24px;margin:8px 0 12px;color:var(--primary)}
.feedback.error{color:#a2241e}
#activity{padding:0;margin:0;list-style:none}
#activity li{padding:9px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
#activity li:last-child{border-bottom:0}
#activity strong{font-size:14px}
#activity p{font-size:13px}
@media(max-width:760px){main{padding:20px 14px 36px}.board,.lower{grid-template-columns:1fr}.flow{gap:5px}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Workflows tự động</h1>
    <p>Bật từng luồng trên máy này và xem kết quả gần nhất.</p>
    <ol class="flow" aria-label="Các bước xử lý"><li>Nhận file</li><li>Phân loại</li><li>Kiểm tra điều kiện</li><li>Xử lý</li><li>Ghi kết quả</li></ol>
  </header>
  <p id="feedback" role="status" aria-live="polite" class="feedback">Đang đọc cấu hình…</p>
  <section class="board" aria-label="Trạng thái workflows">
    <div class="column"><h2>Đang bật</h2><div class="cards" id="enabled"></div></div>
    <div class="column"><h2>Đang tắt</h2><div class="cards" id="disabled"></div></div>
    <div class="column"><h2>Đề xuất</h2><div class="cards" id="proposed"></div></div>
  </section>
  <div class="lower">
    <section class="panel" aria-labelledby="credential-heading">
      <h2 id="credential-heading">Tài khoản gửi EIM</h2>
      <p id="credential-status"></p>
      <form id="credential">
        <label for="user">Username WordPress</label>
        <input id="user" required maxlength="100" autocomplete="username">
        <label for="password">Application Password đã duyệt</label>
        <input id="password" type="password" required maxlength="128" autocomplete="off">
        <button type="submit">Kiểm tra và lưu trên máy</button>
      </form>
    </section>
    <section class="panel" aria-labelledby="activity-heading">
      <h2 id="activity-heading">Gửi file gần đây</h2>
      <ul id="activity"></ul>
    </section>
  </div>
</main>
<script>
const token = __DOCSYNC_TOKEN__;
const byId = id => document.getElementById(id);
const stages = ['enabled', 'disabled', 'proposed'];
const stateLabels = {checking:'Đang kiểm tra', running:'Đang gửi', retry:'Chờ thử lại', review:'Cần kiểm tra', done:'EIM đã nhận', paused:'Đã tạm dừng'};
let pending = false;
let lastData = '';

function node(tag, text, className) {
  const element = document.createElement(tag);
  element.textContent = text;
  if (className) element.className = className;
  return element;
}
function feedback(text, error = false) {
  byId('feedback').textContent = text;
  byId('feedback').classList.toggle('error', error);
}
function draw(data) {
  const serialized = JSON.stringify(data);
  if (lastData === serialized) return;
  lastData = serialized;
  for (const stage of stages) byId(stage).replaceChildren();
  byId('credential-status').textContent = data.configured
    ? 'Đã lưu trên máy. Lưu tài khoản khác sẽ tắt các luồng gửi để bạn bật lại.'
    : 'Lưu thông tin một lần để watcher có thể gửi file khi bạn bật luồng.';
  for (const workflow of data.workflows) {
    const stage = workflow.enabled === null ? 'proposed' : workflow.enabled ? 'enabled' : 'disabled';
    const card = node('article', '', 'item');
    card.append(node('h3', workflow.title), node('p', workflow.source, 'source'), node('p', workflow.description));
    if (workflow.id !== 'local_sort' && workflow.enabled !== null) card.append(node('p', 'Áp dụng cho file mới sau khi bật.'));
    if (workflow.id === 'local_sort') card.append(node('p', 'Công tắc này điều khiển watcher. Lịch định kỳ vẫn có cấu hình riêng.'));
    if (workflow.enabled !== null) {
      const footer = node('div', '', 'item-footer');
      const available = workflow.id === 'local_sort' || data.configured;
      const label = workflow.enabled ? 'Đã bật' : available ? 'Sẵn sàng bật' : 'Cần lưu tài khoản';
      const button = node('button', workflow.enabled ? 'Tắt' : 'Bật', workflow.enabled ? 'secondary' : '');
      button.disabled = !available && !workflow.enabled;
      button.setAttribute('aria-label', `${button.textContent} ${workflow.title}`);
      let draftToggle;
      const settings = {id:workflow.id};
      if (workflow.id === 'ghtk_carrier') {
        const label = node('label', '', 'option');
        draftToggle = node('input');
        draftToggle.type = 'checkbox';
        draftToggle.checked = workflow.draft_batches;
        label.append(draftToggle, 'Dựng lô hóa đơn nháp');
        card.append(label);
        draftToggle.onchange = async () => {
          const saved = await save('/api/workflows', {...settings, enabled:workflow.enabled, draft_batches:draftToggle.checked}, 'Đã lưu tùy chọn dựng lô nháp.');
          if (!saved) draftToggle.checked = workflow.draft_batches;
        };
      }
      button.onclick = () => save('/api/workflows', {...settings, enabled:!workflow.enabled,
        ...(draftToggle ? {draft_batches:draftToggle.checked} : {})}, 'Đã lưu trạng thái workflow.');
      footer.append(node('span', label, `tag ${workflow.enabled ? 'good' : available ? '' : 'warn'}`), button);
      card.append(footer);
    }
    byId(stage).append(card);
  }
  for (const stage of stages) {
    if (!byId(stage).childElementCount) byId(stage).append(node('p', 'Chưa có workflow.'));
  }
  byId('activity').replaceChildren();
  if (!data.activity.length) byId('activity').append(node('li', 'Chưa có lượt gửi tự động.'));
  for (const row of data.activity) {
    const item = node('li', '');
    const date = new Date(row.updated_at * 1000).toLocaleString('vi-VN');
    item.append(node('strong', row.path.split('/').pop()),
      node('p', `${stateLabels[row.state] || row.state} · ${date}`), node('p', row.outcome));
    byId('activity').append(item);
  }
}
async function save(path, data, message) {
  if (pending) return false;
  pending = true;
  feedback('Đang lưu…');
  try {
    const response = await fetch(path, {method:'POST', cache:'no-store',
      headers:{'Content-Type':'application/json','X-CSRF-Token':token}, body:JSON.stringify(data)});
    const value = await response.json();
    if (!response.ok) throw new Error(value.message || 'Không lưu được thay đổi.');
    draw(value);
    feedback(message);
    return true;
  } catch (error) {
    feedback(error.message, true);
    return false;
  } finally {
    pending = false;
  }
}
async function refresh(first = false) {
  if (pending) return;
  try {
    const response = await fetch('/api/workflows', {cache:'no-store'});
    const data = await response.json();
    if (!response.ok) throw new Error(data.message);
    if (!pending) draw(data);
    if (first && !pending) feedback('');
  } catch (error) {
    if (!pending) feedback(error.message || 'Không đọc được trạng thái.', true);
  }
}
byId('credential').onsubmit = event => {
  event.preventDefault();
  if (pending) return;
  const password = byId('password').value;
  byId('password').value = '';
  save('/api/workflows/credential', {user:byId('user').value, password}, 'Đã lưu tài khoản. Bạn có thể bật luồng đối soát GHTK.');
};
refresh(true);
setInterval(refresh, 5000);
</script>
</body>
</html>
